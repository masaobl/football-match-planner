syntax = "proto3";

service FootballService {

    rpc GetMatches (MatchesRequest)
        returns (MatchesResponse);

    rpc GetMatchDetails (MatchRequest)
        returns (MatchResponse);

    rpc CalculateCost (CostRequest)
        returns (CostResponse);

    rpc StreamVisitPlan (VisitRequest)
        returns (stream VisitResponse);
}


// Podatkovni tip za nogometno tekmo

message Match {
    int32 id = 1;
    string home_team = 2;
    string away_team = 3;
    string stadium = 4;
    string city = 5;
    string date = 6;
    string time = 7;
    double ticket_price = 8;
}


// 1. Pridobivanje vseh tekem

message MatchesRequest {
}

message MatchesResponse {
    repeated Match matches = 1;
}


// 2. Pridobivanje podrobnosti izbrane tekme

message MatchRequest {
    int32 match_id = 1;
}

message MatchResponse {
    Match match = 1;
}


// 3. Izracun stroska vstopnic

message CostRequest {
    int32 match_id = 1;
    int32 number_of_people = 2;
}

message CostResponse {
    double ticket_price = 1;
    double total_cost = 2;
}


// 4. Pretakanje nacrta obiska tekme

message VisitRequest {
    int32 match_id = 1;
}

message VisitResponse {
    string step = 1;
}